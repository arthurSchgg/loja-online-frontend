<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Recuperar acesso · Lojinha da Kátia</title>
<link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/components.css"><link rel="stylesheet" href="admin/admin.css"></head>
<body class="admin-body"><a href="#recovery-main" class="skip-link">Ir para o conteúdo</a>
<header class="admin-header"><div class="container"><a href="admin.html" class="text-link">← Painel administrativo</a></div></header>
<main id="recovery-main" class="container admin-main"><section class="admin-panel admin-login"><h1>Recuperar acesso</h1><p>Este formulário nunca revela se um endereço está cadastrado.</p><p id="recovery-status" role="status" aria-live="polite"></p>
<form class="admin-form" id="request-reset"><label class="field">E-mail da conta administrativa<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button class="btn btn--primary" type="submit">Enviar instruções</button></form>
<form class="admin-form" id="confirm-reset" hidden><label class="field">Nova senha<input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label class="field">Confirmar senha<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="btn btn--primary" type="submit">Confirmar nova senha</button></form>
<form id="confirm-email" hidden></form>
<p class="admin-note">O link de recuperação expira e pode ser utilizado uma única vez. Nunca compartilhe esse link.</p></section></main>
<script type="module" src="admin/recovery.js"></script></body></html>
