<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="title description">
<title id="title">Composição editorial de perfumes</title><desc id="description">Frascos translúcidos em tons de âmbar e rosé sobre pedra clara, com flores e luz quente.</desc>
