<linearGradient id="petal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffef3"/><stop offset="1" stop-color="#eccbb2"/></linearGradient>
<linearGradient id="linen" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#fff2dc"/><stop offset="1" stop-color="#d9bda3"/></linearGradient>
