<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
<title id="title">Imagem do produto em preparação</title>
<desc id="desc">Composição ilustrativa neutra de frascos, não representa produto disponível.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf0ea"/><stop offset="1" stop-color="#e9cfca"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".92"/><stop offset=".5" stop-color="#f0c8c4" stop-opacity=".55"/><stop offset="1" stop-color="#b88b7b" stop-opacity=".72"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="600" height="720" fill="url(#bg)"/>
<circle cx="500" cy="100" r="200" fill="#fff" opacity=".15"/>
<ellipse cx="300" cy="520" rx="177" ry="29" fill="#865d58" opacity=".13" filter="url(#shadow)"/>
<g stroke="#ac806f" stroke-width="3" fill="url(#glass)">
 <rect x="207" y="215" width="186" height="280" rx="24"/>
 <rect x="244" y="173" width="112" height="57" rx="12" fill="#af816e" opacity=".68"/>
 <rect x="260" y="151" width="80" height="30" rx="7" fill="#e4c0a9"/>
 <path d="M225 260 V448" fill="none" stroke="#fff" opacity=".7" stroke-width="8"/>
 <path d="M375 260 V448" fill="none" stroke="#fff" opacity=".55" stroke-width="5"/>
</g>
<rect x="250" y="315" width="100" height="100" rx="4" fill="#fffaf4" opacity=".45"/>
<g fill="#76574f" text-anchor="middle" font-family="Georgia, serif">
 <text x="300" y="590" font-size="34">Imagem em breve</text>
 <text x="300" y="629" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">LOJINHA DA KÁTIA</text>
</g>
</svg>